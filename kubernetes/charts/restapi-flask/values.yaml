replicaCount: 1

appPort: 5000

image:
  registry: 797606048546.dkr.ecr.us-east-1.amazonaws.com/flask-app-ecr
  tag: latest

# environmentVariables:
# - name: FLASK_DEBUG
# - value: development

environmentVariablesFrom:
- secretRef:
    name: mongodb-credentials

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

ingress:
  enabled: true

host: flask-app.797606048546.realhandsonlabs.net

mongo:
  database: 
  host: 
  password: 
  user: 

