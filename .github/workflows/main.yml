name: Deploy Render

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python: '3.9'
  
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mongomock
        
